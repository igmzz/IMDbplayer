<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BUSCADOR DE ID'S | TMDB & IMDB</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c1f 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #f0f3fa;
            position: relative;
        }
        
        /* efecto de fondo con partículas sutiles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 200, 100, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* contenedor principal */
        .app-wrapper {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(10, 14, 28, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 3rem;
            box-shadow: 0 35px 60px -20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 220, 150, 0.2);
            padding: 2rem 2rem 2rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        /* header con título */
        .main-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .main-header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(125deg, #FFE6B0, #FFB347, #FF6B4A, #E94057);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255,100,50,0.3);
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        .main-header h1 i {
            background: none;
            -webkit-background-clip: unset;
            color: #ffaa44;
            font-size: 2.4rem;
            filter: drop-shadow(0 0 5px rgba(255,170,0,0.5));
        }
        .subhead {
            font-size: 0.9rem;
            color: #c4b5fd;
            margin-top: 10px;
            border-top: 1px dashed rgba(255,200,130,0.4);
            display: inline-block;
            padding-top: 10px;
            font-weight: 500;
        }

        /* caja de búsqueda mejorada */
        .search-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2.5rem;
            margin-bottom: 2rem;
            padding: 0.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .search-flex {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            background: rgba(30, 35, 55, 0.8);
            border-radius: 2.5rem;
            padding: 0.5rem 0.5rem 0.5rem 2rem;
            backdrop-filter: blur(4px);
        }
        .search-flex i {
            font-size: 1.4rem;
            color: #ffb347;
            filter: drop-shadow(0 0 3px #ffb347);
        }
        .search-flex input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 1rem 0;
            font-size: 1.05rem;
            font-weight: 500;
            color: #ffffff;
            outline: none;
            font-family: 'Inter', monospace;
        }
        .search-flex input::placeholder {
            color: #8e9ec2;
            font-weight: 400;
        }
        .search-flex button {
            background: linear-gradient(95deg, #ff9940, #ff5e2c, #e94057);
            border: none;
            padding: 0.8rem 2.2rem;
            border-radius: 2.5rem;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(255, 80, 40, 0.5);
            letter-spacing: 0.5px;
        }
        .search-flex button:hover {
            transform: scale(0.97);
            background: linear-gradient(95deg, #ff8811, #ff461a, #d6324c);
            box-shadow: 0 8px 22px rgba(255, 60, 30, 0.6);
        }

        /* feedback */
        .feedback-area {
            text-align: center;
            margin: 0.5rem 0 1.2rem;
            min-height: 3rem;
            font-weight: 500;
        }
        .loading {
            color: #ffcd94;
            background: rgba(255,200,100,0.1);
            padding: 0.4rem 1rem;
            border-radius: 3rem;
            display: inline-block;
        }
        .error {
            background: rgba(255, 70, 70, 0.2);
            padding: 0.5rem 1.5rem;
            border-radius: 3rem;
            display: inline-block;
            color: #ffb2b2;
            border-left: 3px solid #ff5555;
        }

        /* grid de películas */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        /* tarjeta interactiva con nuevo estilo */
        .movie-tile {
            background: linear-gradient(145deg, rgba(25, 30, 50, 0.9), rgba(18, 22, 40, 0.95));
            backdrop-filter: blur(4px);
            border-radius: 1.8rem;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 180, 100, 0.3);
            box-shadow: 0 15px 25px -12px rgba(0, 0, 0, 0.5);
        }
        .movie-tile:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 140, 50, 0.8);
            box-shadow: 0 25px 35px -14px rgba(0, 0, 0, 0.7);
            background: linear-gradient(145deg, rgba(35, 40, 65, 0.95), rgba(22, 26, 48, 0.98));
        }
        .poster-img {
            height: 220px;
            background: linear-gradient(135deg, #0e1225, #080c1c);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .poster-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .movie-tile:hover .poster-img img {
            transform: scale(1.05);
        }
        .no-poster {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #141b2e, #0a0f1e);
            color: #a3b5e0;
            gap: 10px;
            font-size: 0.8rem;
        }
        .tile-info {
            padding: 1.1rem 1rem 1.3rem;
        }
        .tile-title {
            font-weight: 800;
            font-size: 1.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
            color: #ffdd99;
        }
        .tile-year {
            font-size: 0.7rem;
            background: rgba(255, 170, 70, 0.2);
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .ids-preview {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 1rem;
            padding: 0.5rem 0.8rem;
            font-size: 0.7rem;
            font-family: monospace;
            margin-top: 6px;
        }
        .preview-tmdb, .preview-imdb {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .click-hint {
            text-align: center;
            margin-top: 10px;
            font-size: 0.7rem;
            opacity: 0.8;
            letter-spacing: 0.5px;
            color: #bbadff;
        }

        /* MODAL mejorado con más información */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(14px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            padding: 1rem;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            background: linear-gradient(145deg, #131b30, #0c1124);
            border-radius: 2rem;
            border: 1px solid rgba(255, 180, 80, 0.5);
            box-shadow: 0 40px 60px rgba(0,0,0,0.6);
            transform: scale(0.96);
            transition: transform 0.25s ease;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.8rem;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid #ffb34760;
            position: sticky;
            top: 0;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .modal-header h3 {
            font-weight: 800;
            font-size: 1.4rem;
            color: #ffdd99;
        }
        .close-modal {
            background: none;
            border: none;
            color: #ffaa66;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.1s;
        }
        .modal-body {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .modal-poster {
            display: flex;
            justify-content: center;
            margin-bottom: 0.5rem;
        }
        .modal-poster img {
            max-width: 140px;
            border-radius: 1.2rem;
            box-shadow: 0 12px 24px rgba(0,0,0,0.5);
            border: 2px solid #ffb347;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #334155;
            padding: 0.6rem 0;
            gap: 12px;
        }
        .detail-label {
            font-weight: 700;
            color: #ffcf9a;
            min-width: 100px;
        }
        .detail-value {
            font-family: monospace;
            word-break: break-all;
            text-align: right;
            color: #e2e8ff;
        }
        .crew-section {
            background: #00000040;
            border-radius: 1.2rem;
            padding: 0.8rem;
            margin-top: 0.5rem;
        }
        .crew-title {
            font-weight: 700;
            color: #ffb347;
            margin-bottom: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .director-name {
            background: #ffaa3340;
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .cast-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .cast-badge {
            background: rgba(100, 120, 200, 0.3);
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .overview-text {
            background: #00000033;
            padding: 0.8rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            line-height: 1.45;
            max-height: 140px;
            overflow-y: auto;
        }
        .copy-id-btn {
            background: #ffaa3340;
            border: none;
            border-radius: 20px;
            padding: 0.2rem 0.8rem;
            margin-left: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.1s;
        }
        .copy-id-btn:hover {
            background: #ffaa33cc;
        }
        .footer-small {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.7rem;
            color: #9dafdf;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e253e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffaa55;
            border-radius: 10px;
        }
        @media (max-width: 640px) {
            .app-wrapper {
                padding: 1rem;
            }
            .search-flex {
                padding: 0.4rem;
            }
            .search-flex button {
                padding: 0.5rem 1.2rem;
            }
            .detail-row {
                flex-direction: column;
            }
            .detail-value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="main-header">
        <h1><i class="fas fa-id-card"></i> BUSCADOR DE ID'S</h1>
        <div class="subhead"><i class="fas fa-film"></i> TMDB · IMDB · Director + Reparto · Información completa</div>
    </div>

    <div class="search-card">
        <div class="search-flex">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Ej: El caballero oscuro, Parasite, Dune, Your Name..." autocomplete="off">
            <button id="searchBtn"><i class="fas fa-meteor"></i> Buscar</button>
        </div>
    </div>

    <div id="feedback" class="feedback-area"></div>

    <div id="moviesGrid" class="movies-grid">
        <div style="grid-column:1/-1; text-align:center; padding:3rem; background:rgba(0,0,0,0.3); border-radius:2rem;">
            <i class="fas fa-sparkle" style="font-size:2.5rem; opacity:0.7; margin-bottom:12px; display:block; color:#ffaa55;"></i>
            🎬 Escribe una película y descubre sus IDs, director y reparto
        </div>
    </div>
    <div class="footer-small">
        <i class="fab fa-tmdb"></i> Datos de TMDb · Haz clic en cualquier tarjeta para ver el director, actores y más detalles
    </div>
</div>

<!-- MODAL DETALLES -->
<div id="detailModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3 id="modalTitle">Información</h3>
            <button class="close-modal" id="closeModalBtn"><i class="fas fa-times-circle"></i></button>
        </div>
        <div class="modal-body" id="modalBody">
            <div style="text-align:center;">Cargando detalles...</div>
        </div>
    </div>
</div>

<script>
    // ---------- CONFIGURACIÓN ----------
    const TMDB_API_KEY = 'b60c8fb1893bba0f1380297e7a40257e';
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w342';

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const feedbackDiv = document.getElementById('feedback');
    const moviesGrid = document.getElementById('moviesGrid');
    const modalOverlay = document.getElementById('detailModal');
    const modalTitleSpan = document.getElementById('modalTitle');
    const modalBodyDiv = document.getElementById('modalBody');
    const closeModalBtn = document.getElementById('closeModalBtn');

    function setFeedback(msg, isError = false, isLoading = false) {
        if (isLoading) feedbackDiv.innerHTML = `<div class="loading"><i class="fas fa-spinner fa-pulse"></i> ${msg}</div>`;
        else if (isError) feedbackDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ${msg}</div>`;
        else feedbackDiv.innerHTML = `<div style="color:#d9e6ff;"><i class="fas fa-info-circle"></i> ${msg}</div>`;
    }
    function clearFeedback() { feedbackDiv.innerHTML = ''; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    async function copyToClipboard(text, label) {
        if(!navigator.clipboard) { alert("No se puede copiar"); return; }
        try {
            await navigator.clipboard.writeText(text);
            setFeedback(`✅ ${label} copiado: ${text}`, false);
            setTimeout(() => { if(feedbackDiv.innerHTML.includes('copiado')) clearFeedback(); }, 1500);
        } catch(e) { setFeedback(`❌ Error al copiar`, true); }
    }

    // Obtener IMDB ID
    async function fetchImdbId(tmdbMovieId) {
        try {
            const res = await fetch(`${BASE_URL}/movie/${tmdbMovieId}?api_key=${TMDB_API_KEY}&append_to_response=external_ids`);
            if(!res.ok) return null;
            const data = await res.json();
            return data.external_ids?.imdb_id || null;
        } catch(e) { return null; }
    }

    // Obtener director y reparto principal (hasta 6 actores)
    async function fetchCredits(tmdbMovieId) {
        try {
            const res = await fetch(`${BASE_URL}/movie/${tmdbMovieId}/credits?api_key=${TMDB_API_KEY}`);
            if(!res.ok) return { director: null, cast: [] };
            const data = await res.json();
            const director = data.crew?.find(member => member.job === 'Director')?.name || null;
            const cast = data.cast?.slice(0, 6).map(actor => actor.name) || [];
            return { director, cast };
        } catch(e) { return { director: null, cast: [] }; }
    }

    // Búsqueda
    async function searchMovies(query) {
        if(!query.trim()) { setFeedback("⚠️ Escribe el nombre de una película", true); return []; }
        setFeedback(`Buscando "${escapeHtml(query)}"...`, false, true);
        try {
            const url = `${BASE_URL}/search/movie?api_key=${TMDB_API_KEY}&language=es&query=${encodeURIComponent(query)}&page=1&include_adult=false`;
            const resp = await fetch(url);
            if(!resp.ok) throw new Error(`Error ${resp.status}`);
            const data = await resp.json();
            if(!data.results || data.results.length === 0) {
                setFeedback(`❌ No se encontraron películas para "${escapeHtml(query)}"`, true);
                return [];
            }
            setFeedback(`🎬 ${data.results.length} películas encontradas. ¡Haz clic para ver director y reparto!`, false);
            return data.results;
        } catch(err) {
            setFeedback(`Error de red: ${err.message}`, true);
            return [];
        }
    }

    // Enriquecer con IMDB y créditos (para mostrar preview, aunque en el modal se recarga más fino)
    async function enrichMovies(movies) {
        const enriched = [];
        for (let movie of movies) {
            const imdb = await fetchImdbId(movie.id);
            enriched.push({ ...movie, imdb_id: imdb, tmdb_id: movie.id });
        }
        return enriched;
    }

    // Renderizar grid
    function renderMoviesGrid(movies) {
        if(!movies.length){
            moviesGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;"><i class="fas fa-film-slash"></i> No hay resultados, prueba otra búsqueda.</div>`;
            return;
        }
        let html = '';
        for (let m of movies) {
            const title = m.title || 'Sin título';
            const year = m.release_date ? m.release_date.split('-')[0] : '????';
            const poster = m.poster_path ? IMG_URL + m.poster_path : null;
            const tmdbShow = m.tmdb_id ? m.tmdb_id : '---';
            const imdbShow = m.imdb_id ? m.imdb_id : 'No disponible';
            html += `
                <div class="movie-tile" data-movie-id="${m.id}" data-movie-title="${escapeHtml(title)}">
                    <div class="poster-img">
                        ${poster ? `<img src="${poster}" alt="${escapeHtml(title)}" loading="lazy">` : `
                            <div class="no-poster"><i class="fas fa-camera-retro"></i> Sin póster</div>
                        `}
                    </div>
                    <div class="tile-info">
                        <div class="tile-title">${escapeHtml(title)}</div>
                        <div class="tile-year"><i class="far fa-calendar-alt"></i> ${escapeHtml(year)}</div>
                        <div class="ids-preview">
                            <span class="preview-tmdb"><i class="fab fa-tmdb" style="color:#01b4e4;"></i> ${tmdbShow}</span>
                            <span class="preview-imdb"><i class="fab fa-imdb" style="color:#f5c518;"></i> ${imdbShow}</span>
                        </div>
                        <div class="click-hint"><i class="fas fa-magic"></i> Click para director + reparto</div>
                    </div>
                </div>
            `;
        }
        moviesGrid.innerHTML = html;
        // listeners
        document.querySelectorAll('.movie-tile').forEach(card => {
            card.addEventListener('click', async (e) => {
                const movieId = card.getAttribute('data-movie-id');
                if(movieId) await openModalWithDetails(movieId);
            });
        });
    }

    // Abrir modal con detalles incluyendo director y reparto
    async function openModalWithDetails(movieId) {
        setFeedback("Cargando información completa...", false, true);
        modalOverlay.classList.add('active');
        modalBodyDiv.innerHTML = `<div style="text-align:center;"><i class="fas fa-spinner fa-pulse"></i> Obteniendo director, reparto e IDs...</div>`;
        
        try {
            // obtener datos básicos de la película
            const movieRes = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${TMDB_API_KEY}&language=es`);
            if(!movieRes.ok) throw new Error("No se pudo cargar la película");
            const movie = await movieRes.json();
            
            // obtener external_ids (IMDB)
            const externalRes = await fetch(`${BASE_URL}/movie/${movieId}?api_key=${TMDB_API_KEY}&append_to_response=external_ids`);
            const externalData = await externalRes.json();
            const imdbId = externalData.external_ids?.imdb_id || null;
            
            // obtener créditos (director y reparto)
            const credits = await fetchCredits(movieId);
            
            const posterFull = movie.poster_path ? `https://image.tmdb.org/t/p/w300${movie.poster_path}` : null;
            const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : 'Desconocido';
            const voteAvg = movie.vote_average ? movie.vote_average.toFixed(1) : '—';
            
            // construir HTML del modal
            modalTitleSpan.innerText = `🎞️ ${escapeHtml(movie.title)}`;
            modalBodyDiv.innerHTML = `
                <div style="display:flex; flex-direction:column; gap:14px;">
                    <div class="modal-poster">
                        ${posterFull ? `<img src="${posterFull}" alt="${escapeHtml(movie.title)}">` : `<div style="background:#00000066; padding:1rem; border-radius:1rem;"><i class="fas fa-image"></i> Sin imagen disponible</div>`}
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-language"></i> Título original:</span>
                        <span class="detail-value">${escapeHtml(movie.original_title || movie.title)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="far fa-calendar-alt"></i> Fecha estreno:</span>
                        <span class="detail-value">${escapeHtml(movie.release_date || 'No especificada')} (${escapeHtml(releaseYear)})</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fab fa-tmdb"></i> TMDB ID:</span>
                        <span class="detail-value">${movie.id} 
                            <button class="copy-id-btn" data-copy-type="tmdb" data-copy-value="${movie.id}"><i class="far fa-copy"></i> Copiar</button>
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fab fa-imdb"></i> IMDB ID:</span>
                        <span class="detail-value">${imdbId ? imdbId : 'No disponible'}
                            ${imdbId ? `<button class="copy-id-btn" data-copy-type="imdb" data-copy-value="${imdbId}"><i class="far fa-copy"></i> Copiar</button>` : ''}
                        </span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label"><i class="fas fa-star" style="color:#ffb347;"></i> Puntuación:</span>
                        <span class="detail-value">⭐ ${voteAvg} / 10 (${movie.vote_count || 0} votos)</span>
                    </div>
                    
                    <div class="crew-section">
                        <div class="crew-title"><i class="fas fa-video"></i> Director</div>
                        ${credits.director ? `<div class="director-name"><i class="fas fa-user-tie"></i> ${escapeHtml(credits.director)}</div>` : '<div style="color:#aaa;">No disponible</div>'}
                        
                        <div class="crew-title" style="margin-top: 12px;"><i class="fas fa-users"></i> Reparto principal</div>
                        <div class="cast-list">
                            ${credits.cast.length ? credits.cast.map(actor => `<span class="cast-badge">${escapeHtml(actor)}</span>`).join('') : '<span>No disponible</span>'}
                        </div>
                    </div>
                    
                    <div>
                        <div class="detail-label" style="margin-bottom:6px;"><i class="fas fa-align-left"></i> Sinopsis:</div>
                        <div class="overview-text">${escapeHtml(movie.overview) || 'No hay sinopsis disponible para esta película.'}</div>
                    </div>
                </div>
            `;
            
            // agregar eventos de copiado
            document.querySelectorAll('.copy-id-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const type = btn.getAttribute('data-copy-type');
                    const value = btn.getAttribute('data-copy-value');
                    if(value && value !== 'No disponible') {
                        copyToClipboard(value, type === 'tmdb' ? 'TMDB ID' : 'IMDB ID');
                    } else {
                        setFeedback('No hay ID válido', true);
                    }
                });
            });
            clearFeedback();
        } catch(err) {
            console.error(err);
            modalBodyDiv.innerHTML = `<div style="color:#ff9999; text-align:center;">❌ Error al cargar los detalles: ${err.message}</div>`;
            setFeedback("Error al cargar información", true);
        }
    }

    async function performSearch() {
        const query = searchInput.value.trim();
        if(!query) { setFeedback("🔍 Escribe una película", true); return; }
        moviesGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem;"><i class="fas fa-spinner fa-pulse"></i> Buscando "${escapeHtml(query)}" ...</div>`;
        const movies = await searchMovies(query);
        if(movies.length === 0) {
            moviesGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem;"><i class="fas fa-face-frown"></i> No se encontraron resultados.</div>`;
            return;
        }
        setFeedback(`🔄 Cargando IDs...`, false, true);
        const enriched = await enrichMovies(movies);
        renderMoviesGrid(enriched);
        clearFeedback();
        setFeedback(`✨ ${enriched.length} películas listas. ¡Toca cualquier tarjeta para ver director y reparto!`, false);
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') performSearch(); });
    closeModalBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
    modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) modalOverlay.classList.remove('active'); });
</script>
</body>
</html>
